<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FinTrack - Modern Loan Collection Platform{% endblock %}</title>
    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/static/images/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/images/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/static/images/favicon-192x192.png">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            200: '#a7f3d0',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b',
                        },
                        navy: {
                            800: '#1e293b',
                            900: '#0f172a',
                            950: '#020617',
                        }
                    }
                }
            }
        }
    </script>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        [x-cloak] { display: none !important; }
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline-block; }
        .htmx-request.htmx-indicator { display: inline-block; }

        /* Smooth scrolling throughout application */
        html {
            scroll-behavior: smooth;
        }

        /* Prevent image blow-up if CSS/CDN is slow */
        img {
            max-width: 100%;
            height: auto;
        }

        /* Modern Universal Scrollbars (Firefox, Chrome 121+, Safari 17.4+) */
        * {
            scrollbar-width: thin;
            scrollbar-color: rgba(148, 163, 184, 0.28) transparent;
        }

        /* WebKit / Chromium custom scrollbars (Chrome, Edge, Opera, Brave) */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background-color: rgba(148, 163, 184, 0.25);
            border-radius: 9999px;
            border: 1px solid transparent;
            background-clip: padding-box;
            transition: background-color 0.2s ease;
        }
        ::-webkit-scrollbar-thumb:hover {
            background-color: rgba(148, 163, 184, 0.5);
        }
        ::-webkit-scrollbar-corner {
            background: transparent;
        }

        /* Dark Mode Scrollbars */
        .dark * {
            scrollbar-color: rgba(148, 163, 184, 0.2) transparent;
        }
        .dark ::-webkit-scrollbar-thumb {
            background-color: rgba(148, 163, 184, 0.22);
        }
        .dark ::-webkit-scrollbar-thumb:hover {
            background-color: rgba(148, 163, 184, 0.45);
        }

        /* Sidebar Specific Scrollbar: Ultra-sleek, floating, non-intrusive */
        .sidebar-scroll {
            scrollbar-width: thin;
            scrollbar-color: transparent transparent;
            scroll-behavior: smooth;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            transition: scrollbar-color 0.3s ease;
        }
        .sidebar-scroll:hover {
            scrollbar-color: rgba(16, 185, 129, 0.35) transparent;
        }
        .sidebar-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .sidebar-scroll::-webkit-scrollbar-thumb {
            background-color: transparent;
            border-radius: 9999px;
            transition: background-color 0.25s ease, box-shadow 0.25s ease;
        }
        .sidebar-scroll:hover::-webkit-scrollbar-thumb {
            background-color: rgba(16, 185, 129, 0.35);
        }
        .sidebar-scroll::-webkit-scrollbar-thumb:hover {
            background-color: rgba(16, 185, 129, 0.75);
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
        }

        /* Main Content Scrollbar */
        .main-scroll {
            scroll-behavior: smooth;
            overscroll-behavior-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* Utility: Hide Scrollbar completely */
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-navy-950 dark:text-slate-100 min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white">

    <!-- Flash Messages / Toast Container -->
    {% if messages %}
    <div class="fixed top-5 right-5 z-50 flex flex-col gap-2 max-w-md w-full px-4 pointer-events-none">
        {% for message in messages %}
        <div class="pointer-events-auto p-4 rounded-2xl shadow-xl border flex items-center justify-between transition-all transform animate-bounce-short
            {% if message.tags == 'success' %}bg-white border-emerald-500 text-emerald-800 dark:bg-slate-900 dark:text-emerald-400
            {% elif message.tags == 'error' %}bg-white border-rose-500 text-rose-800 dark:bg-slate-900 dark:text-rose-400
            {% elif message.tags == 'warning' %}bg-white border-amber-500 text-amber-800 dark:bg-slate-900 dark:text-amber-400
            {% else %}bg-white border-blue-500 text-blue-800 dark:bg-slate-900 dark:text-blue-400{% endif %}">
            <div class="flex items-center gap-3">
                <i data-lucide="{% if message.tags == 'success' %}check-circle-2{% elif message.tags == 'error' %}alert-octagon{% else %}info{% endif %}" class="w-5 h-5 flex-shrink-0"></i>
                <span class="text-sm font-semibold">{{ message }}</span>
            </div>
            <button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-slate-600 dark:hover:text-white ml-3">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    {% block layout %}
        {% block content %}{% endblock %}
    {% endblock %}

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) {
                lucide.createIcons();
            }
        });
        document.body.addEventListener('htmx:afterSwap', function() {
            if (window.lucide) {
                lucide.createIcons();
            }
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
